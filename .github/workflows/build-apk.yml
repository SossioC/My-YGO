name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Installa Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Genera il progetto Android (se manca)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.myygo --project-name my_ygo _tmp_project
            cp -r _tmp_project/android ./android
            rm -rf _tmp_project
          fi
          sed -i 's/android:label="[^"]*"/android:label="My YGO"/' android/app/src/main/AndroidManifest.xml

      - name: Applica l'icona dell'app
        run: |
          find android/app/src/main/res -name 'ic_launcher*' -delete
          cp -r android_res/. android/app/src/main/res/

      - name: Regole per R8 (ignora i riconoscitori di altre scritture di ML Kit)
        run: |
          cat > android/app/proguard-rules.pro <<'EOF2'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF2

      - name: Configura permessi, versione minima e compilazione release
        run: |
          python3 - <<'PY'
          import re, pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = m.read_text()
          perms = ''
          for p in ['INTERNET', 'CAMERA']:
              if 'android.permission.' + p not in t:
                  perms += '\n    <uses-permission android:name="android.permission.' + p + '"/>'
          if perms:
              t = re.sub(r'(<manifest[^>]*>)', lambda x: x.group(1) + perms, t, count=1)
              m.write_text(t)
          for name in ['build.gradle.kts', 'build.gradle']:
              g = pathlib.Path('android/app') / name
              if not g.exists():
                  continue
              s = g.read_text()
              kts = name.endswith('kts')
              rep = 'minSdk = maxOf(24, flutter.minSdkVersion)' if kts else 'minSdkVersion Math.max(24, flutter.minSdkVersion)'
              s = re.sub(r'minSdk(Version)?(\s*=\s*|\s+)flutter\.minSdkVersion', rep, s)
              if 'proguard-rules.pro' not in s:
                  if kts:
                      marker = 'signingConfig = signingConfigs.getByName("debug")'
                      add = marker + '\n            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
                  else:
                      marker = 'signingConfig signingConfigs.debug'
                      add = marker + '\n            minifyEnabled false\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"'
                  if marker in s:
                      s = s.replace(marker, add, 1)
                      print(name, 'release configurato')
                  else:
                      print(name, 'ATTENZIONE: punto release non trovato')
              g.write_text(s)
          PY
          grep -n "permission" android/app/src/main/AndroidManifest.xml || true
          grep -n -E "minSdk|minify|Minify|proguard|signingConfig" android/app/build.gradle* || true

      - name: Usa la chiave di firma fissa
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Scarica le dipendenze
        run: flutter pub get

      - name: Compila l'APK
        run: flutter build apk --release

      - name: Salva l'APK
        uses: actions/upload-artifact@v4
        with:
          name: my-ygo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
