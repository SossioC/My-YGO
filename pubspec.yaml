name: my_ygo
description: Archivio e gestione delle carte Yu-Gi-Oh!
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: '>=0.11.0 <0.13.0'
  google_mlkit_text_recognition: '>=0.15.0 <2.0.0'
  audioplayers: '>=6.0.0 <7.0.0'
  http: '>=1.2.0 <2.0.0'
  sqflite: '>=2.3.0 <3.0.0'
  path_provider: '>=2.1.0 <3.0.0'
  path: '>=1.8.0 <2.0.0'
  file_picker: '>=13.0.0 <14.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
